  const agora = Date.parse('2026-10-30T12:00:00-03:00');
  const d = n => iso(agora - n * DIA);
  let c;

  c = custoEfetivo({ preco: 200 }, {}); t('custo sem regras = preço', c.custo === 200 && c.frete === 0 && c.desconto === 0, c);
  c = custoEfetivo({ preco: 200 }, { cupom_pct: 10, desconto_pix_pct: 5 }); t('cupom 10 % e PIX 5 % em sequência → 171', c.custo === 171 && c.desconto === 29, c);
  c = custoEfetivo({ preco: 200 }, { frete_fixo: 25, frete_gratis_acima: 250 }); t('frete fixo abaixo do mínimo', c.custo === 225, c);
  c = custoEfetivo({ preco: 300 }, { frete_fixo: 25, frete_gratis_acima: 250 }); t('frete grátis acima do mínimo', c.custo === 300, c);
  c = custoEfetivo({ preco: 260 }, { frete_fixo: 25, frete_gratis_acima: 250, desconto_pix_pct: 10 }); t('frete grátis compara com o valor já com desconto', c.custo === 259, c);
  c = custoEfetivo({ preco: 200, frete: 0, desconto: 0 }, { frete_fixo: 25, desconto_pix_pct: 10 }); t('cotação com frete e desconto informados ignora a loja', c.custo === 200, c);
  c = custoEfetivo({ preco: '199,90', frete: '10' }, {}); t('aceita números como texto', c.custo === 209.9, c);
  t('indisponível ou sem preço → null', custoEfetivo({ preco: 200, disponivel: false }, {}) === null && custoEfetivo({ preco: '' }, {}) === null && custoEfetivo({ preco: 0 }, {}) === null);

  let m = metricas({ peso_g: 900, dose_g: 30, proteina_dose_g: 24 }, 200);
  t('métricas: 80 %, R$/kg proteína e R$/dose', perto(m.pct, 0.8) && perto(m.porKg, 277.78) && perto(m.porDose, 6.67), m);
  m = metricas({ peso_g: 900, dose_g: '', proteina_dose_g: 24 }, 200); t('sem dose → sem métricas', m.porKg === null && m.porDose === null && m.pct === null, m);
  t('% suspeita fora de 50–95 %', pctSuspeita(0.97) && pctSuspeita(0.3) && !pctSuspeita(0.8));
  t('creatina: 100 % é normal, 40 % é suspeito', !pctSuspeita(1, 'creatina') && pctSuspeita(0.4, 'creatina') && pctSuspeita(1.1, 'creatina'));
  t('categoria pela coluna ou pelo tipo; sem nada é whey', catDe({ categoria: 'creatina' }) === 'creatina' && catDe({ tipo: 'creapure' }) === 'creatina' &&
    catDe({ tipo: 'isolado' }) === 'whey' && catDe({}) === 'whey' && ativoDe({ tipo: 'monohidratada' }) === 'creatina');
  t('mediana par e ímpar', mediana([3, 1, 2]) === 2 && mediana([4, 1, 3, 2]) === 2.5 && mediana([]) === null);
  t('avaliação do preço', avaliarPreco(90, 100) === 'abaixo' && avaliarPreco(104, 100) === 'perto' && avaliarPreco(106, 100) === 'acima' && avaliarPreco(null, 1) === null);
  t('idade', idade(d(0), agora) === 'hoje' && idade(d(1), agora) === 'ontem' && idade(d(5), agora) === 'há 5 d');
  t('host e loja por host', hostDe('https://www.MaxTitanium.com.br/x/p?a=1') === 'maxtitanium.com.br' &&
    lojaPorHost([{ loja_id: 'a', url: 'https://maxtitanium.com.br' }], 'https://www.maxtitanium.com.br/y/p').loja_id === 'a' && nomeDeHost('gsuplementos.com.br') === 'Gsuplementos');
  t('ID da cotação automática é por dia', idCotacaoAuto('m1', agora) === 'auto_m1_' + iso(agora).slice(0, 10) && idCotacaoAuto('m1', agora) === idCotacaoAuto('m1', agora + 3600e3));

  const dados = {
    lojas: [{ loja_id: 'A', nome: 'A', desconto_pix_pct: 10 }, { loja_id: 'B', nome: 'B', frete_fixo: 20, frete_gratis_acima: 300 }],
    produtos: [
      { produto_id: 'iso', marca: 'X', nome: 'Iso', tipo: 'isolado', peso_g: 900, dose_g: 30, proteina_dose_g: 27, preco_alvo: 300 },
      { produto_id: 'con', marca: 'Y', nome: 'Con', tipo: 'concentrado', peso_g: 900, dose_g: 30, proteina_dose_g: 21 },
      { produto_id: 'vel', marca: 'Y', nome: 'Velho', tipo: 'blend', peso_g: 1000, dose_g: 30, proteina_dose_g: 18 },
      { produto_id: 'arq', marca: 'Z', nome: 'Arquivado', tipo: 'blend', peso_g: 1000, dose_g: 30, proteina_dose_g: 18, ativo: false },
    ],
    cotacoes: [
      { cotacao_id: '1', produto_id: 'iso', loja_id: 'A', data: d(0), preco: 326.18 },
      { cotacao_id: '2', produto_id: 'iso', loja_id: 'A', data: d(3), preco: 300 },
      { cotacao_id: '3', produto_id: 'con', loja_id: 'B', data: d(1), preco: 199.9 },
      { cotacao_id: '4', produto_id: 'con', loja_id: 'A', data: d(20), preco: 180 },
      { cotacao_id: '5', produto_id: 'vel', loja_id: 'B', data: d(40), preco: 100 },
      { cotacao_id: '6', produto_id: 'arq', loja_id: 'B', data: d(0), preco: 1 },
      { cotacao_id: '7', produto_id: 'iso', loja_id: 'B', data: d(0), preco: 400, disponivel: false },
    ],
  };
  let rk = montarRanking(dados, { janela_dias: 7 }, agora);
  t('ranking 7 d: ordem por R$/kg de proteína', rk.map(r => r.produto.produto_id).join() === 'con,iso', rk.map(r => [r.produto.produto_id, r.melhor.porKg]));
  t('ranking usa a cotação mais recente do par produto–loja', rk[1].melhor.ce.preco === 326.18 && perto(rk[1].melhor.porKg, 362.42), rk[1].melhor);
  t('regras da loja entram no custo (B: frete 20 abaixo de 300)', rk[0].melhor.ce.custo === 219.9 && perto(rk[0].melhor.porKg, 349.05), rk[0].melhor.ce);
  t('abaixo do alvo (293,56 ≤ 300)', rk[1].abaixoAlvo && !rk[0].abaixoAlvo);
  t('arquivado e esgotado ficam de fora', !rk.some(r => r.produto.produto_id === 'arq') && rk[1].ofertas.length === 1);
  rk = montarRanking(dados, { janela_dias: 30 }, agora);
  t('janela 30 d traz a oferta melhor de 20 dias atrás', rk[0].produto.produto_id === 'con' && rk[0].melhor.loja.loja_id === 'A' && perto(rk[0].melhor.porKg, 257.14), rk[0].melhor);
  t('janela 0 (tudo) inclui cotações antigas', montarRanking(dados, { janela_dias: 0 }, agora).length === 3);
  t('filtros por tipo, marca e loja', montarRanking(dados, { tipo: 'isolado' }, agora).length === 1 && montarRanking(dados, { marca: 'Y', janela_dias: 0 }, agora).length === 2 &&
    montarRanking(dados, { loja: 'B', janela_dias: 7 }, agora).map(r => r.produto.produto_id).join() === 'con');
  rk = montarRanking(dados, { janela_dias: 7, soDisponiveis: false }, agora);
  t('com esgotados: a oferta esgotada aparece depois das disponíveis', rk[1].ofertas.length === 2 && rk[1].ofertas[1].ce === null);
  t('produto sem dados nutricionais vai para o fim', montarRanking({ ...dados, produtos: dados.produtos.concat([{ produto_id: 'sem', nome: 'Sem' }]),
    cotacoes: dados.cotacoes.concat([{ produto_id: 'sem', loja_id: 'A', data: d(0), preco: 1 }]) }, { janela_dias: 7 }, agora).pop().produto.produto_id === 'sem');

  const hist = historicoProduto({ lojas: dados.lojas, cotacoes: [
    { produto_id: 'iso', loja_id: 'A', data: d(10), preco: 320, preco_min_dia: 280 },
    { produto_id: 'iso', loja_id: 'A', data: iso(agora - 2 * DIA - 3600e3), preco: 330 },
    { produto_id: 'iso', loja_id: 'A', data: d(2), preco: 310 },
    { produto_id: 'iso', loja_id: 'B', data: d(1), preco: 350 },
    { produto_id: 'iso', loja_id: 'A', data: d(200), preco: 300 },
  ] }, 'iso', 7, agora);
  const pa = hist.series.find(s => s.loja_id === 'A').pontos;
  t('histórico: um ponto por loja por dia (o mais recente)', pa.length === 3 && pa[1].custo === 288 && pa[2].custo === 279, pa.map(p => [p.dia, p.custo]));
  t('menor já visto usa o menor preço do dia (280 − 10 % PIX)', hist.menor.custo === 252 && hist.menor.loja_id === 'A', hist.menor);
  t('mediana de 90 dias ignora pontos antigos', hist.mediana90 === 288, hist.mediana90);
  t('melhor atual na janela e avaliação', hist.atual.custo === 279 && hist.avaliacao === 'abaixo', hist.atual);

  // proteína real e lactose
  m = metricas({ peso_g: 900, dose_g: 30, proteina_dose_g: 24, proteina_laudo_g: 18 }, 200);
  t('laudo substitui o rótulo no R$/kg (18 g em 30 g → 60 %)', perto(m.pct, 0.6) && m.verificado && perto(m.pctRotulo, 0.8) && perto(m.porKg, 370.37), m);
  t('sem laudo: proteína do rótulo, não verificada', metricas({ peso_g: 900, dose_g: 30, proteina_dose_g: 24 }, 200).verificado === false);
  t('isolado 10 % mais caro vence o concentrado quando entrega mais proteína',
    metricas({ peso_g: 900, dose_g: 30, proteina_dose_g: 27 }, 165).porKg < metricas({ peso_g: 900, dose_g: 30, proteina_dose_g: 21 }, 150).porKg);
  const comCrea = { ...dados, produtos: dados.produtos.concat([{ produto_id: 'cre', categoria: 'creatina', marca: 'X', nome: 'Crea', tipo: 'monohidratada', peso_g: 300, dose_g: 3, proteina_dose_g: 3 }]),
    cotacoes: dados.cotacoes.concat([{ produto_id: 'cre', loja_id: 'A', data: d(0), preco: 50 }]) };
  rk = montarRanking(comCrea, { janela_dias: 7, categoria: 'creatina' }, agora);
  t('creatina tem ranking próprio: R$/kg de creatina (50 − 10 % PIX em 300 g = 150)', rk.length === 1 && rk[0].produto.produto_id === 'cre' && perto(rk[0].melhor.porKg, 150), rk.map(r => r.melhor.porKg));
  t('ranking de whey não mistura creatina', !montarRanking(comCrea, { janela_dias: 7, categoria: 'whey' }, agora).some(r => r.produto.produto_id === 'cre') &&

  // melhor preço por dia: A tem PIX 10 %, B frete 20 abaixo de 300
  const dd = { lojas: dados.lojas, produtos: dados.produtos, cotacoes: [
    { produto_id: 'iso', loja_id: 'A', data: d(5), preco: 300 },                   // 270 de 5 dias atrás até hoje (validade 7 d)
    { produto_id: 'iso', loja_id: 'B', data: d(3), preco: 240 },                   // 260
    { produto_id: 'iso', loja_id: 'B', data: d(1), preco: 240, disponivel: false }, // B esgota
    { produto_id: 'iso', loja_id: 'A', data: d(20), preco: 200 },                  // 180, vale de 20 a 14 dias atrás
  ] };
  let md = melhorPorDia(dd, 'iso', 6, agora);
  t('melhor por dia: menor custo entre as lojas, esgotado não conta', md.map(x => x.custo).join() === '270,270,260,260,270,270' && md[2].loja_id === 'B' && md[5].k === 0, md);
  md = melhorPorDia(dd, 'iso', 25, agora);
  t('melhor por dia: cotação vale por 7 dias e depois some', md[24 - 20].custo === 180 && md[24 - 14].custo === 180 && md[24 - 13].custo === null, md.map(x => [x.k, x.custo]));
  t('melhor por dia: filtro de loja', melhorPorDia(dd, 'iso', 6, agora, { loja: 'A' }).every(x => x.custo === 270));
  const sc = serieComparativa(dd, {}, 6, agora);
  t('comparativo: R$/kg por dia e menor da série', sc.length === 1 && sc[0].produto.produto_id === 'iso' && perto(sc[0].atual, 333.33) &&
    perto(sc[0].minimo.porKg, 320.99) && sc[0].minimo.k === 3, sc.map(s => [s.atual, s.minimo]));

  // comprar ou esperar
  const ser = v => v.map((custo, i) => ({ k: v.length - 1 - i, custo }));
  let dc = decisaoCompra(ser([300, 310, 320, 330, 300, 310, 320, 330, 300, 310, 320, 330, 300, 310, 280]));
  t('comprar: hoje é o menor preço do histórico (o próprio dia conta meio)', dc.estado === 'comprar' && !dc.historicoCurto && perto(dc.posicao, 14.5 / 15), dc);
  dc = decisaoCompra(ser([280, 290, 300, 280, 290, 300, 280, 290, 300, 280, 290, 300, 280, 290, 330]));
  t('esperar: hoje é o mais caro; bom preço e quando foi a última vez', dc.estado === 'esperar' && dc.bom === 280 && dc.ultimaVezBom === 2, dc);
  dc = decisaoCompra(ser(Array(15).fill(300)));
  t('preço parado é normal, não bom momento', dc.estado === 'normal' && dc.posicao === 0.5, dc);
  dc = decisaoCompra(ser(Array(12).fill(300).concat([280, 280, 280])));
  t('queda que dura alguns dias continua bom momento', dc.estado === 'comprar', dc);
  dc = decisaoCompra(ser([300, null, 310, null]));
  t('1 dia de coleta: frase sem comparação vazia', /Ainda sem histórico para comparar \(1 dia de coleta\)/.test(fraseMomento(decisaoCompra(ser([300])))));
  t('sem preço hoje e histórico curto', dc.estado === 'sem-preco' && dc.historicoCurto && dc.dias === 2, dc);

  t('iso() tem fuso',/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d[+-]\d\d:\d\d$/.test(iso(Date.now())), iso(Date.now()));
  let f = [];
  enfileirar(f, { qid: 'a', op: 'upsert', aba: 'Cotacoes', id: '1', dados: { preco: 40 } });
  enfileirar(f, { qid: 'b', op: 'upsert', aba: 'Cotacoes', id: '1', dados: { frete: 10 } });
  t('fila junta upserts do mesmo id', f.length === 1 && f[0].dados.preco === 40 && f[0].dados.frete === 10, f);

  f = [{ qid: 'a', op: 'upsert', aba: 'Cotacoes', id: '1', dados: { preco: 40 } }];

  t('não mexe em operação em envio', f.length === 2 && f[0].dados.frete === undefined, f);

  const ok = res.filter(r => r.ok).length;
  $('#app').innerHTML = `<div class="top"><h1>Testes</h1><a href="./" class="badge">voltar</a></div>
    <div class="card"><b>${ok}/${res.length} passaram</b><ul class="testes">${res.map(r => `<li class="${r.ok ? 'p' : 'f'}">${r.ok ? '✓' : '✗'} ${esc(r.nome)}${r.ok ? '' : `<pre class="small">${esc(JSON.stringify(r.info))}</pre>`}</li>`).join('')}</ul></div>`;
  return res;
}
