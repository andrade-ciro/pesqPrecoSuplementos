<style>
:root{--bg:#0f1115;--bg2:#181b22;--bg3:#232733;--bd:#2e3340;--tx:#e8eaf0;--tx2:#9aa1b2;--ac:#4f8cff;--ok:#2fbf71;--warn:#f5a524;--err:#ef4444;--r:14px}

html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}

.muted{color:var(--tx2)}.small{font-size:13px}.center{text-align:center}.right{text-align:right}

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
const VERSAO = '1.2.0';

// <núcleo> — funções puras, sem DOM; testadas por ?test e por testes/rodar.js
const DEF = { janela_dias: 7, intervalo_coleta_h: 6, historico_dias: 180, falhas_para_pausar: 5 };
/**
 * Categorias de produto. Cada uma tem a sua métrica (R$/kg do ativo: proteína ou creatina), os seus tipos
 * e a faixa plausível do % de ativo (RP-02). As colunas proteina_dose_g e proteina_laudo_g guardam o ativo por dose.
 */
const CATEGORIAS = {
  whey: { nome: 'Whey', ativo: 'proteína', faixa: [0.5, 0.95], dose: 30, porDose: 24,
    tipos: { concentrado: 'Concentrado', isolado: 'Isolado', hidrolisado: 'Hidrolisado', blend: 'Blend' } },
  creatina: { nome: 'Creatina', ativo: 'creatina', faixa: [0.5, 1], dose: 3, porDose: 3,
    tipos: { monohidratada: 'Monohidratada', creapure: 'Creapure', outra: 'Outra forma' } },
};
const TIPOS = Object.assign({}, ...Object.values(CATEGORIAS).map(c => c.tipos));
/** Categoria do produto; sem a coluna (planilhas antigas), deduz pelo tipo e cai em whey. */
const catDe = p => p && CATEGORIAS[p.categoria] ? p.categoria : (Object.keys(CATEGORIAS).find(k => p && CATEGORIAS[k].tipos[p.tipo]) || 'whey');
const ativoDe = p => CATEGORIAS[catDe(p)].ativo;
const COM_LACTOSE = ['concentrado', 'blend']; // isolado e hidrolisado têm pouca lactose
const VALIDADE_DIAS = 7; // por quantos dias a última cotação de uma loja vale no histórico diário
const COLS = {
  Produtos: ['marca', 'nome', 'tipo', 'sabor', 'peso_g', 'dose_g', 'proteina_dose_g', 'preco_alvo', 'ativo', 'obs', 'proteina_laudo_g', 'laudo_fonte', 'categoria'],
  Lojas: ['nome', 'tipo', 'url', 'plataforma', 'frete_fixo', 'frete_gratis_acima', 'desconto_pix_pct', 'cupom', 'cupom_pct', 'ativo'],
  Monitores: ['produto_id', 'loja_id', 'url', 'sku', 'sku_nome', 'adaptador', 'ativo'],
  Cotacoes: ['produto_id', 'loja_id', 'monitor_id', 'origem', 'data', 'preco', 'preco_min_dia', 'preco_lista', 'frete', 'desconto',
    'disponivel', 'url', 'obs', 'registrado_em'],
};
const DIA = 864e5;

function num(x) {
  if (x === '' || x == null) return null;
  const n = typeof x === 'number' ? x : parseFloat(String(x).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}
function bool(x, padrao = false) {
  if (x === '' || x == null) return padrao;
  return x === true || x === 1 || /^(true|sim|1|verdadeiro)$/i.test(String(x));
}
const arred = x => Math.round(x * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const fmtR = x => x == null ? '—' : 'R$ ' + Number(x).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = (x, d = 2) => x == null ? '' : Number(x).toLocaleString('pt-BR', { maximumFractionDigits: d });
const fmtPeso = g => g == null ? '' : g >= 1000 ? fmtN(g / 1000) + ' kg' : fmtN(g) + ' g';
const fmtPct = p => p == null ? '' : Math.round(p * 100) + '%';
/** ISO 8601 com o fuso local, ex. 2026-10-30T07:30:00-03:00 */
function iso(ms) {
  const d = new Date(ms), off = -d.getTimezoneOffset(), a = Math.abs(off);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` +
    `${off >= 0 ? '+' : '-'}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}
const diaDe = ms => iso(ms).slice(0, 10);
/** ID determinístico da cotação automática: uma por monitor por dia (RP-11). */
const idCotacaoAuto = (monitorId, ms) => `auto_${monitorId}_${diaDe(ms)}`;
const indexar = (lista, chave) => Object.fromEntries((lista || []).map(x => [String(x[chave]), x]));

/** Dias inteiros entre a data da cotação e hoje, pelo calendário local. */
function diasAtras(dataIso, agoraMs) {
  const t = Date.parse(dataIso);
  if (isNaN(t)) return null;
  const ini = ms => { const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  return Math.round((ini(agoraMs) - ini(t)) / DIA);
}
function idade(dataIso, agoraMs) {
  const n = diasAtras(dataIso, agoraMs);
  return n == null ? '' : n <= 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} d`;
}

function hostDe(url) {
  const m = String(url || '').trim().match(/^https?:\/\/(?:www\.)?([^\/?#:]+)/i);
  return m ? m[1].toLowerCase() : '';
}
const lojaPorHost = (lojas, url) => { const h = hostDe(url); return h ? (lojas || []).find(l => hostDe(l.url) === h) || null : null; };
function nomeDeHost(h) {
  const base = String(h || '').replace(/\.(com|net|org|loja|store)?(\.br)?$/, '').split('.').pop();
  return base ? base[0].toUpperCase() + base.slice(1) : '';
}

/**
 * Custo efetivo (RP-07): preço − desconto + frete. Quando a cotação não informa frete ou desconto,
 * valem as regras da loja (cupom e PIX em sequência; frete grátis acima de um valor). Igual a custoEfetivo_ do Code.gs.
 * → { preco, desconto, frete, custo } ou null se indisponível / sem preço
 */
function custoEfetivo(c, loja) {
  const preco = num(c.preco);
  if (preco == null || preco <= 0 || !bool(c.disponivel, true)) return null;
  loja = loja || {};
  let desconto = num(c.desconto);
  if (desconto == null) {
    const cupom = num(loja.cupom_pct) || 0, pix = num(loja.desconto_pix_pct) || 0;
    desconto = preco - preco * (1 - cupom / 100) * (1 - pix / 100);
  }
  let frete = num(c.frete);
  if (frete == null) {
    const gratis = num(loja.frete_gratis_acima);
    frete = gratis != null && preco - desconto >= gratis ? 0 : num(loja.frete_fixo) || 0;
  }
  return { preco, desconto: arred(desconto), frete: arred(frete), custo: arred(preco - desconto + frete) };
}

/**
 * % de ativo (proteína ou creatina), R$/kg do ativo e R$ por dose de um produto a um custo.
 * Ativo real: o medido em laudo (proteina_laudo_g), se houver; senão o do rótulo (verificado = false).
 */
function metricas(prod, custo) {
  const peso = num(prod.peso_g), dose = num(prod.dose_g), rotulo = num(prod.proteina_dose_g), laudo = num(prod.proteina_laudo_g);
  const prot = laudo != null ? laudo : rotulo;
  const pct = dose > 0 && prot != null ? prot / dose : null;
  return {
    pct,
    verificado: laudo != null && dose > 0,
    pctRotulo: dose > 0 && rotulo != null ? rotulo / dose : null,
    porKg: custo != null && peso > 0 && pct > 0 ? arred(custo / (peso / 1000 * pct)) : null,
    porDose: custo != null && peso > 0 && dose > 0 ? arred(custo / (peso / dose)) : null,
  };
}
const pctSuspeita = (p, cat = 'whey') => p != null && (p < CATEGORIAS[cat].faixa[0] || p > CATEGORIAS[cat].faixa[1] + 1e-9); // RP-02

function mediana(v) {
  const a = v.filter(x => x != null).sort((x, y) => x - y);
  if (!a.length) return null;
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : arred((a[m - 1] + a[m]) / 2);
}
/** RP-20: abaixo da mediana, perto (até 5 % acima) ou acima. */
function avaliarPreco(atual, med) {
  if (atual == null || med == null) return null;
  return atual < med ? 'abaixo' : atual <= med * 1.05 ? 'perto' : 'acima';
}
const maisRecente = (a, b) => !a || Date.parse(b.data) > Date.parse(a.data) ||
  (Date.parse(b.data) === Date.parse(a.data) && String(b.registrado_em || '') > String(a.registrado_em || ''));

/**
 * Ranking de custo-benefício (RP-16..RP-18). Para cada produto ativo, a cotação mais recente de cada loja
 * dentro da janela; o produto entra com a melhor loja. Sem dados nutricionais vai para o fim.
 * f: { categoria, tipo, marca, loja, janela_dias (0 = tudo), soDisponiveis, semLactose }
 * → [{ produto, ofertas: [{ cot, loja, ce, porKg, porDose, pct }], melhor, abaixoAlvo }]
 */
const passaFiltro = (p, f) => bool(p.ativo, true) && (!f.categoria || catDe(p) === f.categoria) && (!f.tipo || p.tipo === f.tipo) && (!f.marca || p.marca === f.marca) &&
  !(f.semLactose && COM_LACTOSE.includes(p.tipo));
function montarRanking(dados, f, agoraMs) {
  f = f || {};
  const lojas = indexar(dados.lojas, 'loja_id');
  const limite = f.janela_dias > 0 ? agoraMs - f.janela_dias * DIA : -Infinity;
  const ultima = {}; // produto|loja → cotação mais recente
  for (const c of dados.cotacoes || []) {
    const t = Date.parse(c.data);
    if (isNaN(t) || t < limite || (f.loja && c.loja_id !== f.loja)) continue;
    const k = c.produto_id + '|' + c.loja_id;
    if (maisRecente(ultima[k], c)) ultima[k] = c;
  }
  const porProd = {};
  for (const c of Object.values(ultima)) (porProd[c.produto_id] = porProd[c.produto_id] || []).push(c);
  const soDisp = f.soDisponiveis !== false;
  const out = [];
  for (const p of dados.produtos || []) {
    if (!passaFiltro(p, f)) continue;
    const ofertas = (porProd[p.produto_id] || []).map(cot => {
      const loja = lojas[cot.loja_id] || {};
      const ce = custoEfetivo(cot, loja);
      return Object.assign({ cot, loja, ce }, metricas(p, ce && ce.custo));
    }).filter(o => o.ce || !soDisp)
      .sort((a, b) => (a.ce ? a.ce.custo : Infinity) - (b.ce ? b.ce.custo : Infinity));
    if (!ofertas.length) continue;
    const melhor = ofertas[0], alvo = num(p.preco_alvo);
    out.push({ produto: p, ofertas, melhor, abaixoAlvo: !!(alvo > 0 && melhor.ce && melhor.ce.custo <= alvo) });
  }
  const chave = r => r.melhor.porKg != null ? r.melhor.porKg : r.melhor.ce ? 1e9 + r.melhor.ce.custo : Infinity;
  return out.sort((a, b) => chave(a) - chave(b));
}

/**
 * Histórico de um produto (RP-19, RP-20): um ponto por loja por dia (o mais recente do dia),
 * menor custo já visto (pelo menor preço do dia), mediana de 90 dias e o melhor preço atual dentro da janela.
 */
function historicoProduto(dados, produtoId, janelaDias, agoraMs) {
  const lojas = indexar(dados.lojas, 'loja_id');
  const porLoja = {};
  let menor = null;
  for (const c of dados.cotacoes || []) {
    if (c.produto_id !== produtoId) continue;
    const t = Date.parse(c.data);
    if (isNaN(t)) continue;
    const loja = lojas[c.loja_id] || {};
    const minDia = num(c.preco_min_dia) != null ? c.preco_min_dia : c.preco;
    const ceMin = custoEfetivo({ ...c, preco: minDia, disponivel: true }, loja);
    if (ceMin && (!menor || ceMin.custo < menor.custo)) menor = { custo: ceMin.custo, data: c.data, loja_id: c.loja_id };
    const ce = custoEfetivo(c, loja);
    if (!ce) continue;
    const dias = porLoja[c.loja_id] = porLoja[c.loja_id] || {};
    const dia = String(c.data).slice(0, 10);
    if (maisRecente(dias[dia] && dias[dia].cot, c)) dias[dia] = { t, dia, custo: ce.custo, cot: c, loja_id: c.loja_id };
  }
  const series = Object.entries(porLoja).map(([loja_id, d]) => ({ loja_id, pontos: Object.values(d).sort((a, b) => a.t - b.t) }));
  const todos = series.flatMap(s => s.pontos);
  const med = mediana(todos.filter(p => p.t >= agoraMs - 90 * DIA).map(p => p.custo));
  const limite = janelaDias > 0 ? agoraMs - janelaDias * DIA : -Infinity;
  let atual = null;
  for (const s of series) {
    const u = s.pontos[s.pontos.length - 1];
    if (u.t >= limite && (!atual || u.custo < atual.custo)) atual = u;
  }
  return { series, menor, mediana90: med, atual, avaliacao: avaliarPreco(atual && atual.custo, med) };
}

/**
 * Melhor custo efetivo de um produto em cada um dos últimos `dias` dias (o último é hoje).
 * Em cada dia vale, por loja, a cotação mais recente até aquele dia e de no máximo VALIDADE_DIAS dias;
 * se ela diz esgotado, a loja não conta. f.loja restringe a uma loja.
 * → [{ k (dias atrás), t, custo | null, loja_id }] do mais antigo para hoje
 */
function melhorPorDia(dados, produtoId, dias, agoraMs, f) {
  f = f || {};
  const lojas = indexar(dados.lojas, 'loja_id');
  const porLoja = {}; // loja → { k → cotação mais recente do dia }
  for (const c of dados.cotacoes || []) {
    if (c.produto_id !== produtoId || (f.loja && c.loja_id !== f.loja)) continue;
    const k = diasAtras(c.data, agoraMs);
    if (k == null || k < 0 || k >= dias + VALIDADE_DIAS) continue;
    const m = porLoja[c.loja_id] = porLoja[c.loja_id] || {};
    if (maisRecente(m[k], c)) m[k] = c;
  }
  const out = [];
  for (let k = dias - 1; k >= 0; k--) {
    let melhor = null;
    for (const [lojaId, m] of Object.entries(porLoja)) {
      let c = null;
      for (let j = k; j < k + VALIDADE_DIAS && !c; j++) c = m[j] || null;
      const ce = c && custoEfetivo(c, lojas[lojaId]);
      if (ce && (!melhor || ce.custo < melhor.custo)) melhor = { custo: ce.custo, loja_id: lojaId };
    }
    out.push({ k, t: agoraMs - k * DIA, custo: melhor ? melhor.custo : null, loja_id: melhor ? melhor.loja_id : null });
  }
  return out;
}

/** Percentil p (0–1) por interpolação linear. */
function percentil(v, p) {
  const a = v.filter(x => x != null).sort((x, y) => x - y);
  if (!a.length) return null;
  const i = (a.length - 1) * p, lo = Math.floor(i);
  return arred(a[lo] + (a[Math.min(lo + 1, a.length - 1)] - a[lo]) * (i - lo));
}

/**
 * Comprar agora ou esperar? Compara o melhor custo de hoje com os dias do histórico (saída de melhorPorDia).
 * posicao: fração dos dias em que o preço esteve mais caro que hoje (empates contam meio) — 0,8 = mais barato que em 80 % dos dias.
 * estado: 'comprar' (entre os 25 % dias mais baratos), 'esperar' (entre os 35 % mais caros e
 * mais de 3 % acima da mediana), 'normal', 'sem-preco' (nada disponível hoje).
 * historicoCurto: menos de 14 dias com preço; a recomendação vale pouco.
 * bom: preço que já é "bom" para este produto (percentil 25); ultimaVezBom: há quantos dias ele esteve nesse nível.
 */
function decisaoCompra(serie) {
  const hoje = serie.length ? serie[serie.length - 1] : null;
  const vals = serie.map(p => p.custo).filter(x => x != null);
  const r = { estado: 'sem-preco', atual: hoje && hoje.custo, dias: vals.length, historicoCurto: vals.length < 14,
    minimo: vals.length ? Math.min(...vals) : null, mediana: mediana(vals), bom: percentil(vals, 0.25), posicao: null, ultimaVezBom: null };
  if (!hoje || hoje.custo == null) return r;
  const atual = hoje.custo;
  r.posicao = vals.reduce((a, v) => a + (v > atual ? 1 : v === atual ? 0.5 : 0), 0) / vals.length;
  const antes = serie.slice(0, -1).reverse().find(p => p.custo != null && p.custo <= r.bom);
  r.ultimaVezBom = antes ? antes.k : null;
  r.estado = r.posicao >= 0.75 ? 'comprar'
    : r.posicao <= 0.35 && atual > r.mediana * 1.03 ? 'esperar' : 'normal';
  return r;
}

/**
 * Séries do gráfico comparativo: R$/kg do ativo real no melhor preço de cada dia, por produto que passa no filtro.
 * → [{ produto, pontos: [{ k, t, custo, porKg, loja_id }], atual (R$/kg hoje ou null), minimo: { porKg, k } | null }]
 */
function serieComparativa(dados, f, dias, agoraMs) {
  f = f || {};
  const out = [];
  for (const p of dados.produtos || []) {
    if (!passaFiltro(p, f)) continue;
    const pontos = melhorPorDia(dados, p.produto_id, dias, agoraMs, f)
      .map(x => Object.assign(x, { porKg: metricas(p, x.custo).porKg }));
    if (!pontos.some(x => x.porKg != null)) continue;
    let minimo = null;
    for (const x of pontos) if (x.porKg != null && (!minimo || x.porKg < minimo.porKg)) minimo = { porKg: x.porKg, k: x.k };
    out.push({ produto: p, pontos, atual: pontos[pontos.length - 1].porKg, minimo });
  }
  return out;
}

/** Insere uma operação na fila, juntando upserts pendentes do mesmo registro. Não toca operações em envio. */
function enfileirar(fila, op, emEnvio = new Set()) {
  const mesmo = x => x.aba === op.aba && x.id === op.id && !emEnvio.has(x.qid);
  if (op.op === 'upsert') {
    const i = fila.findIndex(x => x.op === 'upsert' && mesmo(x));
    // Só junta se não houver delete do mesmo id depois do upsert pendente
    if (i >= 0 && !fila.slice(i + 1).some(x => x.op === 'delete' && x.aba === op.aba && x.id === op.id)) {
      fila[i] = { ...fila[i], dados: { ...fila[i].dados, ...op.dados } };
      return fila;
    }
  } else if (op.op === 'delete') {
    for (let i = fila.length - 1; i >= 0; i--) if (fila[i].op === 'upsert' && mesmo(fila[i])) fila.splice(i, 1);
  }
  fila.push(op);
  return fila;
}
/** Explicação do momento de compra (saída de decisaoCompra) em uma ou duas frases. */
function fraseMomento(d) {
  if (!d || d.estado === 'sem-preco') return 'Sem preço disponível hoje.';
  if (d.dias < 3) return `Ainda sem histórico para comparar (${d.dias} dia${d.dias === 1 ? '' : 's'} de coleta): a indicação de comprar ou esperar aparece com o tempo e fica confiável a partir de 14 dias.`;
  const pct = Math.round(d.posicao * 100);
  const ultima = d.ultimaVezBom != null ? ` (última vez ${d.ultimaVezBom === 1 ? 'ontem' : `há ${d.ultimaVezBom} dias`})` : '';
  let f;
  if (d.estado === 'comprar') f = `Bom momento: hoje está mais barato que em ${pct} % dos últimos ${d.dias} dias.`;
  else if (d.estado === 'esperar') f = `Caro agora: mais caro que em ${100 - pct} % dos últimos ${d.dias} dias. Se puder esperar, costuma chegar a ${fmtR(d.bom)}${ultima}.`;
  else f = `Preço comum: mais barato que em ${pct} % dos últimos ${d.dias} dias. Um bom preço para este produto é até ${fmtR(d.bom)}${ultima}.`;
  if (d.historicoCurto) f += ` Histórico curto (${d.dias} dia${d.dias === 1 ? '' : 's'}): a indicação fica confiável a partir de 14 dias de coleta.`;
  return f;
}

// ---------------------------------------------------------------- utilidades de DOM

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function uuid() {
  if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) { /* contexto inseguro */ } }
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
function fmtData(s) {
  const d = new Date(s);
  if (isNaN(d)) return '';
  return d.getFullYear() === new Date().getFullYear() ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`;
}
const fmtDataHora = s => { const d = new Date(s); return isNaN(d) ? '—' : d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };

async function api(metodo, corpo, params, ms = 30000) {
  if (!S.cfg.url) throw new Error('URL do Web App não configurada');
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    let res;
    if (metodo === 'GET') {
      const u = new URL(S.cfg.url);
      Object.entries(Object.assign({}, params, { token: S.cfg.token })).forEach(([k, v]) => u.searchParams.set(k, v));
      res = await fetch(u, { signal: ctrl.signal, redirect: 'follow' });
    } else {
      // text/plain evita o preflight de CORS, que o Apps Script não atende
      res = await fetch(S.cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: S.cfg.token }, corpo)),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal, redirect: 'follow' });
    }
    const txt = await res.text();
    let j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('Resposta inválida do Web App (confira a URL e o acesso "Qualquer pessoa")'); }
    if (!j.ok) throw new Error(j.erro || 'Erro no Web App');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Tempo esgotado');
    if (e instanceof TypeError) throw new Error('Sem rede ou Web App inacessível');
    throw e;
  } finally { clearTimeout(t); }
}

async function sincronizar() {
  const sy = S.sync;
  clearTimeout(sy.timer);
  if (sy.ocupado || !S.cfg.url || !S.fila.length) { atualizarBadge(); return; }
  sy.ocupado = true;
  const lote = S.fila.slice(0, 60);
  lote.forEach(x => sy.emEnvio.add(x.qid));
  atualizarBadge();
  try {
    await api('POST', { ops: lote.map(({ op, aba, id, dados }) => ({ op, aba, id, dados })) });
    const enviados = new Set(lote.map(x => x.qid));
    S.fila = S.fila.filter(x => !enviados.has(x.qid));
    salvar.fila();
    sy.erro = null; sy.espera = 0; sy.ultimo = Date.now(); LS.set('ultimoSync', sy.ultimo);
  } catch (e) {
    sy.erro = e.message;
    sy.espera = Math.min(60000, (sy.espera || 2500) * 2);
  } finally {
    sy.ocupado = false;
    sy.emEnvio.clear();
    atualizarBadge();
    if (S.fila.length) sy.timer = setTimeout(sincronizar, sy.erro ? sy.espera : 50);
  }
}

/** Baixa catálogo, monitores e cotações. Só substitui o cache se não houver nada pendente (RT-07). */
async function carregarDados(silencioso) {
  if (!S.cfg.url) return;
  try {
    await sincronizar();
    if (S.fila.length) { if (!silencioso) toast('Há envios pendentes; tente de novo após sincronizar'); return; }
    const r = await api('GET', null, { acao: 'bootstrap' });
    S.cache = Object.assign({}, CACHE_VAZIO, r.dados, { atualizadoEm: Date.now() });
    salvar.cache();
    S.sync.erro = null;
    if (!silencioso) toast('Dados atualizados da planilha');
    const r0 = rota().r;
    if (!S.ui.modal && !['editar-produto', 'loja', 'monitor', 'cotacao', 'config'].includes(r0)) render();
  } catch (e) {
    S.sync.erro = e.message;
    if (!silencioso) toast('Falha ao carregar: ' + e.message);
  }
  atualizarBadge();
}

function badgeTxt() {
  const n = S.fila.length;
  if (!S.cfg.url) return '<span class="dot err"></span>não configurado';
  if (S.sync.ocupado) return `<span class="dot warn"></span>enviando ${n}…`;
  if (!navigator.onLine && n) return `<span class="dot warn"></span>offline · ${n} pendente${n > 1 ? 's' : ''}`;
  if (S.sync.erro) return `<span class="dot err"></span>erro${n ? ' · ' + n + ' pendente' + (n > 1 ? 's' : '') : ''}`;
  if (n) return `<span class="dot warn"></span>${n} pendente${n > 1 ? 's' : ''}`;
  return '<span class="dot"></span>sincronizado';
}
const badgeHtml = () => `<button class="badge" id="badge" data-a="ir" data-h="#/config" aria-label="Estado da sincronização">${badgeTxt()}</button>`;

async function coletarAgora(monitorId) {
  if (S.ui.coletando) return;
  S.ui.coletando = true; render();
  const antes = iso(Date.now() + 1000);
  let total = 0, erros = 0;
  try {
    await sincronizar();
    if (S.fila.length) throw new Error('há envios pendentes; o robô ainda não conhece as mudanças');
    for (let i = 0; i < 40; i++) {
      const r = await api('GET', null, { acao: 'coletar', monitor_id: monitorId || '', antes }, 90000);
      total += r.coletados;
      erros += r.resultados.filter(x => x.status === 'erro' || x.status === 'pausado').length;
      if (monitorId || !r.restantes || !r.coletados) break;
      toast(`Coletando… ${total} feitos, ${r.restantes} restantes`);
    }
    await carregarDados(true);
    toast(`Coleta concluída: ${total} link${total === 1 ? '' : 's'}${erros ? `, ${erros} com erro` : ''}`);
  } catch (e) {
    toast('Falha na coleta: ' + e.message);
  } finally {
    S.ui.coletando = false;
    render();
  }
}

function rota() {

  const [r, p] = h.split('/');
  return { r: r || 'inicio', p: p ? decodeURIComponent(p) : '' };
}

function topo(titulo, extra = '') {
  return `<div class="top"><h1 class="clamp">${esc(titulo)}</h1>${extra}${badgeHtml()}</div>`;

  if (alvos.length) {
    h += `<div class="card" id="alertas"><b>🏷️ Abaixo do preço-alvo</b>${alvos.map(r => `
      <a class="li" href="#/produto/${encodeURIComponent(r.produto.produto_id)}"><span class="grow"><b>${esc(nomeProd(r.produto))}</b>
        <div class="muted small">${esc(r.melhor.loja.nome || '')} · alvo ${fmtR(num(r.produto.preco_alvo))}</div></span>
        <b class="num">${fmtR(r.melhor.ce.custo)}</b></a>`).join('')}</div>`;
  }
  const problemas = S.cache.monitores.filter(m => m.ultimo_status === 'pausado' || m.ultimo_status === 'erro').length;
  if (problemas) h += `<a class="card row" href="#/monitores" style="color:inherit;text-decoration:none"><span class="tag err">robô</span><span class="grow small">${problemas} link${problemas > 1 ? 's' : ''} com erro ou pausado${problemas > 1 ? 's' : ''}</span><span>→</span></a>`;

  const marcas = [...new Set(S.cache.produtos.filter(p => catDe(p) === cat).map(p => p.marca).filter(Boolean))].sort();
  const opt = (v, t, sel) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`;
  h += `<div class="chips mt" role="tablist">${Object.entries(CATEGORIAS).map(([k, c]) =>
    `<button class="chip grow ${k === cat ? 'on' : ''}" data-a="categoria" data-c="${k}" role="tab" aria-selected="${k === cat}">${c.nome}</button>`).join('')}</div>`;
  h += `<div class="filtros mt"><div class="grid3">
      <select id="f-tipo" aria-label="Tipo">${opt('', 'Tipo', f.tipo)}${Object.entries(CATEGORIAS[cat].tipos).map(([k, v]) => opt(k, v, f.tipo)).join('')}</select>
      <select id="f-marca" aria-label="Marca">${opt('', 'Marca', f.marca)}${marcas.map(m => opt(m, m, f.marca)).join('')}</select>
      <select id="f-loja" aria-label="Loja">${opt('', 'Loja', f.loja)}${lojasOrd().map(l => opt(l.loja_id, l.nome, f.loja)).join('')}</select></div>
    ${f.semLactose && cat === 'whey' ? '<div class="muted small mt">Só isolados e hidrolisados: "evitar lactose" está ligado nas Configurações.</div>' : ''}</div>`;

  // Histórico diário de cada produto: decide o momento (últimos 90 dias) e desenha o comparativo
  const diasGraf = S.filtros.dias_graf || 30;
  const comp = serieComparativa(S.cache, f, Math.max(90, diasGraf), agora);
  const decisao = {};
  for (const sc of comp) decisao[sc.produto.produto_id] = decisaoCompra(sc.pontos.slice(-90));

  const lider = rk.find(r => r.melhor.ce && r.melhor.porKg != null);
  if (lider) {
    const segundo = rk.find(r => r !== lider && r.melhor.ce && r.melhor.porKg != null);
    const d = decisao[lider.produto.produto_id];
    const vantagem = segundo ? Math.round((1 - lider.melhor.porKg / segundo.melhor.porKg) * 100) : null;
    // Algum produto já esteve bem mais barato por kg do ativo do que o líder está hoje?
    const melhorJa = comp.filter(sc => sc.minimo && sc.minimo.porKg < lider.melhor.porKg * 0.95)
      .sort((a, b) => a.minimo.porKg - b.minimo.porKg)[0];
    const quando = k => k === 0 ? 'hoje' : k === 1 ? 'ontem' : `há ${k} dias`;
    h += `<div class="card lider" id="lider"><div class="row"><span class="grow muted small">Melhor compra agora</span>${tagMomento(d)}</div>
      <a href="#/produto/${encodeURIComponent(lider.produto.produto_id)}" style="color:inherit;text-decoration:none">
        <b>${esc(nomeProd(lider.produto))}</b>
        <div class="mt"><span class="valor">${fmtR(lider.melhor.porKg)}</span> <span class="muted small">/kg de ${at} · ${fmtR(lider.melhor.ce.custo)} na ${esc(lider.melhor.loja.nome || '?')}</span></div></a>
      <p class="small" style="margin:8px 0 0">${segundo ? `${vantagem > 0 ? `${vantagem} % mais barato` : 'Empatado'} por kg de ${at} que o 2º, ${esc(nomeProd(segundo.produto))} (${fmtR(segundo.melhor.porKg)}). ` : ''}${fraseMomento(d)}</p>
      ${melhorJa ? `<p class="small muted" style="margin:6px 0 0">Já houve oferta melhor: ${esc(nomeProd(melhorJa.produto))} chegou a ${fmtR(melhorJa.minimo.porKg)}/kg ${quando(melhorJa.minimo.k)}.</p>` : ''}</div>`;
  }

  h += `<div class="card" id="comparativo"><b>Comparativo</b><div class="muted small">R$ por kg de ${at} real, no melhor preço de cada dia · mais baixo = melhor</div>
    <div class="chips mt">${[[30, '30 dias'], [90, '90 dias'], [180, '180 dias']].map(([d, t]) =>
      `<button class="chip ${diasGraf === d ? 'on' : ''}" data-a="diasGraf" data-d="${d}">${t}</button>`).join('')}</div>
    ${graficoComparativo(comp, diasGraf, decisao, at)}</div>`;

  h += `<h2>Ranking</h2><div class="chips">${[[1, '24 h'], [7, '7 dias'], [30, '30 dias'], [0, 'Tudo']].map(([d, t]) =>
      `<button class="chip ${jan === d ? 'on' : ''}" data-a="janela" data-d="${d}">${t}</button>`).join('')}
      <button class="chip ${f.soDisponiveis !== false ? '' : 'on'}" data-a="toggleDisp" style="margin-left:auto">${f.soDisponiveis !== false ? 'Ver esgotados' : 'Com esgotados'}</button></div>`;

  if (!rk.length) {
    h += `<p class="muted">${S.cache.cotacoes.length ? `Nenhuma cotação de ${CATEGORIAS[cat].nome.toLowerCase()} com esses filtros.` : 'Nenhuma cotação ainda. Toque em ＋ para monitorar o link de uma oferta.'}</p>`;
  }
  h += rk.map((r, i) => {
    const o = r.melhor, p = r.produto, link = linkOferta(o);
    const outras = r.ofertas.length - 1;
    return `<div class="card rk ${r.abaixoAlvo ? 'alvo' : ''}" data-pid="${esc(p.produto_id)}">
      <a href="#/produto/${encodeURIComponent(p.produto_id)}">
        <div class="row"><span class="pos">${i + 1}</span><span class="grow"><b>${esc(nomeProd(p))}</b><div class="muted small clamp">${esc(descProd(p))}</div></span></div>
        <div class="row mt"><div class="grow">${o.ce ? (o.porKg != null ? `<span class="valor">${fmtR(o.porKg)}</span> <span class="muted small">/kg ${at}</span>${o.verificado ? ' <span class="tag ok">laudo</span>' : ''}`
          : `<span class="muted small">cadastre peso, dose e ${at}</span>`) : '<span class="tag warn">esgotado</span>'}</div>
          <div class="right">${o.ce ? `<b class="num">${fmtR(o.ce.custo)}</b><div class="muted small num">${o.porDose != null ? fmtR(o.porDose) + '/dose' : ''}</div>` : ''}</div></div>
        <div class="muted small mt">${esc(o.loja.nome || '?')} · ${idade(o.cot.data, agora)} · ${o.cot.origem === 'manual' ? 'manual' : 'robô'}${outras ? ` · +${outras} loja${outras > 1 ? 's' : ''}` : ''}
          ${o.ce ? tagMomento(decisao[p.produto_id]) : ''}${r.abaixoAlvo ? ' <span class="tag ok">abaixo do alvo</span>' : ''}</div></a>
      ${link ? `<a class="btn ir" href="${esc(link)}" target="_blank" rel="noopener" aria-label="Abrir oferta na loja">↗</a>` : ''}</div>`;
  }).join('');
  if (S.cache.atualizadoEm) h += `<p class="muted small center">Dados da planilha de ${new Date(S.cache.atualizadoEm).toLocaleString('pt-BR')}</p>`;
  return h + nav('inicio');
}

// ---- histórico do produto (RP-19, RP-20)
const CORES = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300']; // validadas para fundo escuro (daltonismo)
const corLoja = id => { const i = lojasOrd().findIndex(l => l.loja_id === id); return i >= 0 && i < CORES.length ? CORES[i] : '#9aa1b2'; };

function graficoHist(h, alvo) {
  const series = h.series.filter(s => s.pontos.length);
  const pontosDica = S.ui.grafs.graf = [];
  if (!series.length) return '<p class="muted small">Sem cotações disponíveis para desenhar.</p>';
  const W = 340, H = 180, m = { l: 52, r: 12, t: 14, b: 22 };
  const pts = series.flatMap(s => s.pontos);
  let t0 = Math.min(...pts.map(p => p.t)), t1 = Math.max(...pts.map(p => p.t));
  if (t1 - t0 < DIA) { t0 -= DIA; t1 += DIA; }
  const vs = pts.map(p => p.custo).concat(alvo > 0 ? [alvo] : []);
  let v0 = Math.min(...vs), v1 = Math.max(...vs);
  const folga = Math.max((v1 - v0) * 0.08, 5); v0 -= folga; v1 += folga;
  const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - v0) / (v1 - v0)) * (H - m.t - m.b);
  let svg = '';
  [v0 + folga, (v0 + v1) / 2, v1 - folga].forEach(v => {
    svg += `<line class="grade" x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
      <text class="eixo" x="${m.l - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${esc(fmtR(Math.round(v)).replace(',00', ''))}</text>`;
  });
  svg += `<text class="eixo" x="${m.l}" y="${H - 6}">${fmtData(t0 + (t1 - t0 < 2 * DIA + 1 ? DIA : 0))}</text>
    <text class="eixo" x="${W - m.r}" y="${H - 6}" text-anchor="end">${fmtData(t1 - (t1 - t0 < 2 * DIA + 1 ? DIA : 0))}</text>`;
  if (alvo > 0) svg += `<line class="alvo" x1="${m.l}" x2="${W - m.r}" y1="${y(alvo).toFixed(1)}" y2="${y(alvo).toFixed(1)}"/>
    <text class="eixo" x="${W - m.r}" y="${(y(alvo) - 4).toFixed(1)}" text-anchor="end">alvo</text>`;
  let menorPt = null;
  series.forEach(s => {
    const cor = corLoja(s.loja_id);
    if (s.pontos.length > 1) svg += `<polyline fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" points="${s.pontos.map(p => `${x(p.t).toFixed(1)},${y(p.custo).toFixed(1)}`).join(' ')}"/>`;
    s.pontos.forEach(p => {
      svg += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.custo).toFixed(1)}" r="4" fill="${cor}" stroke="var(--bg2)" stroke-width="2"/>`;
      pontosDica.push({ x: x(p.t), y: y(p.custo), txt: `${fmtData(p.cot.data)} · ${nomeLoja(s.loja_id)} · ${fmtR(p.custo)}` });
      if (!menorPt || p.custo < menorPt.custo) menorPt = p;
    });
  });
  // Rótulo seletivo: só o menor ponto do gráfico
  const mx = x(menorPt.t), my = y(menorPt.custo);
  svg += `<text class="eixo" x="${Math.min(Math.max(mx, m.l + 30), W - m.r - 30).toFixed(1)}" y="${(my + 16 > H - m.b ? my - 9 : my + 16).toFixed(1)}" text-anchor="middle">${esc(fmtR(menorPt.custo))}</text>`;
  svg += `<line id="graf-x" class="grade" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" style="display:none"/>`;
  const leg = series.length > 1 ? `<div class="leg">${series.map(s => `<span><i style="background:${corLoja(s.loja_id)}"></i>${esc(nomeLoja(s.loja_id))}</span>`).join('')}</div>` : '';
  return `<div class="graf">${leg}<svg id="graf" data-graf viewBox="0 0 ${W} ${H}" role="img" aria-label="Custo efetivo por dia e por loja">${svg}</svg><div id="graf-tip" class="tip"></div></div>`;
}

/**
 * Gráfico comparativo: uma linha por produto (R$/kg do ativo real no melhor preço do dia).
 * Os 5 melhores de hoje ganham cor; a cor segue o produto (ordem alfabética entre eles), não a posição.
 * Os demais ficam em cinza, ao fundo. O toque mostra o dia com os valores dos destacados.
 */
function graficoComparativo(comp, dias, decisao, at = 'proteína') {
  const id = 'grafc';
  S.ui.grafs[id] = [];
  const series = comp.map(sc => ({ ...sc, pontos: sc.pontos.slice(-dias) })).filter(sc => sc.pontos.some(x => x.porKg != null));
  if (!series.length) return `<p class="muted small">Sem cotações de produtos com peso, dose e ${at} cadastrados.</p>`;
  const ultimo = sc => { for (let i = sc.pontos.length - 1; i >= 0; i--) if (sc.pontos[i].porKg != null) return sc.pontos[i].porKg; return Infinity; };
  const ord = series.slice().sort((a, b) => (a.atual ?? Infinity) - (b.atual ?? Infinity) || ultimo(a) - ultimo(b));
  const dest = ord.slice(0, 5), outros = ord.slice(5);
  const cor = new Map(dest.slice().sort((a, b) => porNome(a.produto, b.produto)).map((sc, i) => [sc.produto.produto_id, CORES[i]]));
  const W = 340, H = 200, m = { l: 52, r: 12, t: 12, b: 22 };
  const n = series[0].pontos.length;
  let iIni = n - 1;
  for (const sc of series) { const i = sc.pontos.findIndex(x => x.porKg != null); if (i >= 0 && i < iIni) iIni = i; }
  const t1 = series[0].pontos[n - 1].t;
  let t0 = series[0].pontos[iIni].t;
  if (t1 - t0 < DIA) t0 = t1 - DIA;
  const vs = series.flatMap(sc => sc.pontos.map(x => x.porKg).filter(v => v != null));
  let v0 = Math.min(...vs), v1 = Math.max(...vs);
  const folga = Math.max((v1 - v0) * 0.08, 5); v0 -= folga; v1 += folga;
  const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - v0) / (v1 - v0)) * (H - m.t - m.b);
  let svg = '';
  [v0 + folga, (v0 + v1) / 2, v1 - folga].forEach(v => {
    svg += `<line class="grade" x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
      <text class="eixo" x="${m.l - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${esc(fmtR(Math.round(v)).replace(',00', ''))}</text>`;
  });
  svg += `<text class="eixo" x="${m.l}" y="${H - 6}">${fmtData(t0)}</text><text class="eixo" x="${W - m.r}" y="${H - 6}" text-anchor="end">hoje</text>`;
  // Linha quebrada nos dias sem preço; ponto isolado vira um círculo pequeno
  const linha = (sc, c, w) => {
    let seg = [], out = '';
    const fecha = () => {
      if (seg.length > 1) out += `<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${seg.join(' ')}"/>`;
      else if (seg.length === 1) { const [a, b] = seg[0].split(','); out += `<circle cx="${a}" cy="${b}" r="${w > 1.5 ? 3 : 2}" fill="${c}"/>`; }
      seg = [];
    };
    sc.pontos.forEach(p => { if (p.porKg == null || p.t < t0) fecha(); else seg.push(`${x(p.t).toFixed(1)},${y(p.porKg).toFixed(1)}`); });
    fecha();
    return out;
  };
  outros.forEach(sc => { svg += linha(sc, '#4b5263', 1.5); });
  dest.slice().reverse().forEach(sc => {
    const c = cor.get(sc.produto.produto_id);
    svg += linha(sc, c, 2);
    const u = sc.pontos[sc.pontos.length - 1];
    if (u.porKg != null) svg += `<circle cx="${x(u.t).toFixed(1)}" cy="${y(u.porKg).toFixed(1)}" r="4" fill="${c}" stroke="var(--bg2)" stroke-width="2"/>`;
  });
  // Dica: um alvo por dia, com os destacados daquele dia em ordem de R$/kg
  const curto = p => { const t = nomeProd(p); return t.length > 26 ? t.slice(0, 25) + '…' : t; };
  for (let i = iIni; i < n; i++) {
    const t = series[0].pontos[i].t;
    const linhas = dest.map(sc => [sc.produto, sc.pontos[i].porKg]).filter(([, v]) => v != null).sort((a, b) => a[1] - b[1]);
    if (!linhas.length) continue;
    S.ui.grafs[id].push({ x: x(t), y: m.t, txt: `${fmtData(t)}\n` + linhas.map(([p, v]) => `${fmtR(v)}  ${curto(p)}`).join('\n') });
  }
  svg += `<line id="${id}-x" class="grade" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" style="display:none"/>`;
  const leg = dest.map(sc => `<a class="legc" href="#/produto/${encodeURIComponent(sc.produto.produto_id)}"><i style="background:${cor.get(sc.produto.produto_id)}"></i>
      <span class="grow clamp">${esc(nomeProd(sc.produto))}</span><span class="num">${sc.atual != null ? fmtR(sc.atual) : '<span class="muted">sem preço hoje</span>'}</span>${tagMomento(decisao[sc.produto.produto_id])}</a>`).join('')
    + (outros.length ? `<div class="legc muted"><i style="background:#4b5263"></i>Outros ${outros.length} produto${outros.length > 1 ? 's' : ''} (em cinza)</div>` : '');
  return `<div class="graf"><svg id="${id}" data-graf viewBox="0 0 ${W} ${H}" role="img" aria-label="R$ por kg de ${at} por dia, por produto">${svg}</svg><div id="${id}-tip" class="tip ml"></div></div>
    <div class="mt">${leg}</div>`;
}

function telaProduto(id) {
  const p = prodPorId(id);
  if (!p) return topoVoltar('Produto') + '<p class="muted">Produto não encontrado.</p>' + nav('produtos');
  const agora = Date.now(), jan = janela();
  const hs = historicoProduto(S.cache, id, jan, agora);
  const srv = S.cache.minimos[id];
  const menor = srv && (!hs.menor || srv.custo < hs.menor.custo) ? srv : hs.menor;
  const atual = hs.atual, alvo = num(p.preco_alvo);
  const mAtual = metricas(p, atual && atual.custo), at = ativoDe(p);
  const dec = decisaoCompra(melhorPorDia(S.cache, id, 90, agora));
  let h = topoVoltar(nomeProd(p), `<button data-a="ir" data-h="#/editar-produto/${encodeURIComponent(id)}" aria-label="Editar produto">✎</button>`);
  h += `<div class="muted small">${esc(descProd(p))}</div>`;
  h += `<div class="stats mt">
    <div class="stat"><span class="muted small">Melhor agora</span><b>${atual ? fmtR(atual.custo) : '—'}</b>
      <span class="muted small">${atual ? `${esc(nomeLoja(atual.loja_id))} · ${idade(atual.cot.data, agora)}` : `nada nos últimos ${jan} d`}</span></div>
    <div class="stat"><span class="muted small">Por kg de ${at}</span><b>${fmtR(mAtual.porKg)}</b>
      <span class="muted small">${mAtual.pct != null ? (mAtual.verificado ? 'teor do laudo' : 'teor do rótulo') : ''}${mAtual.porDose != null ? ' · ' + fmtR(mAtual.porDose) + '/dose' : ''}</span></div>
    <div class="stat"><span class="muted small">Menor já visto</span><b>${menor ? fmtR(menor.custo) : '—'}</b>
      <span class="muted small">${menor ? `${fmtData(menor.data)} · ${esc(nomeLoja(menor.loja_id))}` : ''}</span></div>
    <div class="stat"><span class="muted small">Bom preço até</span><b>${fmtR(dec.bom)}</b>
      <span class="muted small">${dec.dias ? `mediana ${fmtR(dec.mediana)} em ${dec.dias} d` : ''}</span></div></div>`;
  const pos = montarRanking(S.cache, { janela_dias: jan, categoria: catDe(p) }, agora).filter(r => r.melhor.ce && r.melhor.porKg != null);
  const iPos = pos.findIndex(r => r.produto.produto_id === id);
  h += `<div class="card" id="momento"><div class="row"><b class="grow">Comprar agora?</b>${tagMomento(dec)}</div>
    <p class="small" style="margin:8px 0">${fraseMomento(dec)}</p>
    ${iPos >= 0 ? `<p class="small muted" style="margin:8px 0 0">${iPos === 0 ? `É o melhor custo por kg de ${at} entre os seus produtos de ${CATEGORIAS[catDe(p)].nome.toLowerCase()} hoje.`
      : `É o ${iPos + 1}º em custo por kg de ${at} hoje; o 1º é ${esc(nomeProd(pos[0].produto))} (${fmtR(pos[0].melhor.porKg)}/kg).`}</p>` : ''}</div>`;
  if (p.laudo_fonte || num(p.proteina_laudo_g) != null) {
    const fonte = p.laudo_fonte ? (/^https?:\/\//i.test(p.laudo_fonte) ? `<a href="${esc(p.laudo_fonte)}" target="_blank" rel="noopener">fonte ↗</a>` : esc(p.laudo_fonte)) : '';
    h += `<div class="card small"><b>Laudo:</b> ${num(p.proteina_laudo_g) != null ? `${fmtN(num(p.proteina_laudo_g))} g de ${at} por dose (rótulo: ${fmtN(num(p.proteina_dose_g))} g)` : 'sem valor medido'}${fonte ? ' · ' + fonte : ''}</div>`;
  }
  if (alvo > 0) h += `<div class="card row"><span class="grow">Preço-alvo <b>${fmtR(alvo)}</b> <span class="muted small">(${fmtR(metricas(p, alvo).porKg)}/kg ${at})</span></span>
    ${atual && atual.custo <= alvo ? '<span class="tag ok">abaixo do alvo</span>' : ''}</div>`;
  h += `<div class="card"><b>Custo efetivo por dia</b>${graficoHist(hs, alvo)}</div>`;

  const ofertas = (montarRanking({ ...S.cache, produtos: [p] }, { janela_dias: 0, soDisponiveis: false }, agora)[0] || { ofertas: [] }).ofertas;
  h += '<h2>Última cotação por loja</h2><div class="card">' + (ofertas.map(o => {
    const link = linkOferta(o);
    return `<div class="li"><span class="grow"><b>${esc(o.loja.nome || '?')}</b>
      <div class="muted small">${idade(o.cot.data, agora)} · ${o.cot.origem === 'manual' ? 'manual' : 'robô'}${o.ce ? ` · preço ${fmtR(o.ce.preco)}${o.ce.desconto ? ' − ' + fmtR(o.ce.desconto) : ''}${o.ce.frete ? ' + frete ' + fmtR(o.ce.frete) : ''}` : ''}</div></span>
      ${o.ce ? `<b class="num">${fmtR(o.ce.custo)}</b>` : '<span class="tag warn">esgotado</span>'}
      ${link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener" aria-label="Abrir oferta">↗</a>` : ''}</div>`;
  }).join('') || '<p class="muted">Sem cotações.</p>') + '</div>';

  const mons = S.cache.monitores.filter(m => m.produto_id === id);
  h += '<h2>Monitorados pelo robô</h2><div class="card">' + (mons.map(m => `<a class="li" href="#/monitor/${encodeURIComponent(m.monitor_id)}">
      <span class="grow"><b>${esc(nomeLoja(m.loja_id))}</b><div class="muted small clamp">${esc(m.sku_nome || hostDe(m.url))} · ${m.ultima_coleta ? fmtDataHora(m.ultima_coleta) : 'ainda não coletado'}</div></span>${tagStatus(m)}</a>`).join('')
    || '<p class="muted small">Nenhum link monitorado.</p>') + '</div>';
  h += `<div class="row"><button class="grow" data-a="novoMonitor" data-pid="${esc(id)}">+ Monitorar link</button><button class="grow" data-a="ir" data-h="#/cotacao/${encodeURIComponent(id)}">+ Cotação manual</button></div>`;

  const cots = S.cache.cotacoes.filter(c => c.produto_id === id).sort((a, b) => String(b.data).localeCompare(String(a.data))).slice(0, 40);
  h += '<h2>Cotações</h2><div class="card">' + (cots.map(c => {
    const ce = custoEfetivo(c, lojaPorId(c.loja_id));
    return `<button class="li" data-a="modal" data-t="cot" data-id="${esc(c.cotacao_id)}"><span class="grow">${fmtData(c.data)} · ${esc(nomeLoja(c.loja_id))}
      <div class="muted small">${c.origem === 'manual' ? 'manual' : 'robô'}${num(c.preco_min_dia) != null && num(c.preco_min_dia) < num(c.preco) ? ` · menor do dia ${fmtR(num(c.preco_min_dia))}` : ''}${c.obs ? ' · ' + esc(c.obs) : ''}</div></span>
      <span class="num">${ce ? fmtR(ce.custo) : '<span class="tag warn">esgotado</span>'}</span></button>`;
  }).join('') || '<p class="muted">Sem cotações.</p>') + '</div>';
  return h + nav('inicio');
}

// ---- produtos (RP-01..RP-05)
function telaProdutos() {
  const lista = S.cache.produtos.filter(p => S.ui.verArquivados || bool(p.ativo, true))
    .sort((a, b) => String(a.marca).localeCompare(String(b.marca), 'pt-BR') || String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
  let h = topo('Produtos');
  h += `<input id="busca" placeholder="Buscar produto" autocomplete="off">`;
  // Por categoria e, dentro dela, por marca (fechada por padrão); o cabeçalho mostra o melhor R$/kg da marca
  const agora = Date.now();
  const porKg = {};
  for (const r of montarRanking(S.cache, { janela_dias: janela() }, agora)) if (r.melhor.ce) porKg[r.produto.produto_id] = r.melhor.porKg;
  const grupos = new Map();
  lista.forEach(p => { const k = catDe(p) + '|' + (p.marca || 'Sem marca'); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(p); });
  let catAtual = null;
  for (const [chave, prods] of [...grupos].sort((a, b) => Object.keys(CATEGORIAS).indexOf(a[0].split('|')[0]) - Object.keys(CATEGORIAS).indexOf(b[0].split('|')[0]))) {
    const [cat, marca] = [chave.slice(0, chave.indexOf('|')), chave.slice(chave.indexOf('|') + 1)];
    if (cat !== catAtual) { catAtual = cat; h += `<h2 data-cat="${cat}">${CATEGORIAS[cat].nome}</h2>`; }
    const aberta = S.ui.marcasAbertas.has(chave);
    const melhores = prods.map(p => porKg[p.produto_id]).filter(v => v != null);
    const avisos = prods.filter(p => { const pct = metricas(p, null).pct; return pct == null || pctSuspeita(pct, cat); }).length;
    h += `<div class="card grupo" data-grupo="${esc(chave)}" data-marca="${esc(marca)}">
      <button class="li" data-a="toggleMarca" data-m="${esc(chave)}" aria-expanded="${aberta}"><span class="seta" aria-hidden="true"></span>
        <span class="grow"><b>${esc(marca)}</b><div class="muted small">${prods.length} produto${prods.length > 1 ? 's' : ''}${melhores.length ? ` · melhor ${fmtR(Math.min(...melhores))}/kg ${CATEGORIAS[cat].ativo}` : ''}</div></span>
        ${avisos ? '<span class="tag warn">confira</span>' : ''}</button>
      <div class="grupo-corpo" ${aberta ? '' : 'hidden'}>${prods.map(p => {
        const pct = metricas(p, null).pct;
        return `<a class="li" href="#/produto/${encodeURIComponent(p.produto_id)}" data-busca="${esc(nomeProd(p).toLowerCase() + ' ' + (p.sabor || '').toLowerCase())}">
          <span class="grow"><b>${esc(p.nome)}</b><div class="muted small">${esc(descProd(p))}</div></span>
          ${porKg[p.produto_id] != null ? `<span class="num small">${fmtR(porKg[p.produto_id])}/kg</span>` : ''}
          ${pctSuspeita(pct, cat) || pct == null ? '<span class="tag warn">confira</span>' : ''}${bool(p.ativo, true) ? '' : '<span class="tag">arquivado</span>'}</a>`;
      }).join('')}</div></div>`;
  }
  if (!lista.length) h += '<p class="muted">Catálogo vazio.</p>';
  h += `<button class="pri big mt" data-a="ir" data-h="#/editar-produto/novo">+ Novo produto</button>`;
  h += `<button class="ghost w100 mt muted" data-a="toggleArq">${S.ui.verArquivados ? 'Ocultar' : 'Mostrar'} arquivados</button>`;
  return h + nav('produtos');
}

const opcoesTipo = (cat, sel) => Object.entries(CATEGORIAS[cat].tipos).map(([k, v]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${v}</option>`).join('');
const Cap = s => s[0].toUpperCase() + s.slice(1);
function camposProduto(p, pre = 'p') {
  const marcas = [...new Set(S.cache.produtos.map(x => x.marca).filter(Boolean))].sort();
  const pct = metricas(p, null).pct, cat = catDe(p), c = CATEGORIAS[cat];
  return `<label class="f">Categoria</label><select id="${pre}-cat" data-cat="${pre}">${Object.entries(CATEGORIAS).map(([k, v]) => `<option value="${k}" ${k === cat ? 'selected' : ''}>${v.nome}</option>`).join('')}</select>
    <label class="f">Marca</label><input id="${pre}-marca" list="marcas" value="${esc(p.marca)}" placeholder="Growth">
    <datalist id="marcas">${marcas.map(m => `<option value="${esc(m)}">`).join('')}</datalist>
    <label class="f">Nome</label><input id="${pre}-nome" value="${esc(p.nome)}" placeholder="${cat === 'creatina' ? 'Creatina Monohidratada 300 g' : '100% Whey Concentrado'}">
    <div class="grid2"><label>Tipo<select id="${pre}-tipo">${opcoesTipo(cat, p.tipo)}</select></label>
      <label>Sabor<input id="${pre}-sabor" value="${esc(p.sabor)}" placeholder="${cat === 'creatina' ? 'Sem sabor' : 'Chocolate'}"></label></div>
    <div class="grid3 mt"><label>Peso total (g)<input id="${pre}-peso" data-pct="${pre}" inputmode="numeric" value="${esc(p.peso_g)}" placeholder="${cat === 'creatina' ? 300 : 900}"></label>
      <label>Dose (g)<input id="${pre}-dose" data-pct="${pre}" inputmode="decimal" value="${esc(fmtN(num(p.dose_g)))}" placeholder="${c.dose}"></label>
      <label><span id="${pre}-l-prot">${Cap(c.ativo)}/dose (g)</span><input id="${pre}-prot" data-pct="${pre}" inputmode="decimal" value="${esc(fmtN(num(p.proteina_dose_g)))}" placeholder="${c.porDose}"></label></div>
    <div class="grid2 mt"><label><span id="${pre}-l-laudo">${Cap(c.ativo)}/dose no laudo (g)</span><input id="${pre}-laudo" data-pct="${pre}" inputmode="decimal" value="${esc(fmtN(num(p.proteina_laudo_g)))}" placeholder="opcional"></label>
      <label>Fonte do laudo<input id="${pre}-laudo-fonte" value="${esc(p.laudo_fonte)}" placeholder="link ou nome do laboratório"></label></div>
    <div class="small mt" id="${pre}-pct">${pctTxt(pct, cat)}</div>
    <p class="muted small">Se um laudo de laboratório mediu menos que o rótulo, informe o valor medido: o ranking passa a usá-lo no R$/kg.</p>
    <label class="f">Preço-alvo (R$ de custo efetivo, opcional)</label><input id="${pre}-alvo" inputmode="decimal" value="${esc(fmtN(num(p.preco_alvo)))}">
    <p class="muted small">Kit (ex.: 2 × 900 g): informe o peso total. Confira dose e quantidade por dose na tabela nutricional do rótulo.</p>`;
}
const pctTxt = (pct, cat = 'whey') => {
  const at = CATEGORIAS[cat].ativo, [a, b] = CATEGORIAS[cat].faixa;
  return pct == null ? `<span class="muted">% de ${at}: informe dose e ${at} por dose</span>`
    : `% de ${at} real: <b>${fmtPct(pct)}</b>${pctSuspeita(pct, cat) ? ` <span class="aviso">— fora de ${Math.round(a * 100)}–${Math.round(b * 100)} %, confira os valores</span>` : ''}`;
};
function lerProduto(pre, base) {
  return Object.assign({}, base, {
    categoria: val(`#${pre}-cat`) || 'whey', marca: val(`#${pre}-marca`), nome: val(`#${pre}-nome`), tipo: val(`#${pre}-tipo`), sabor: val(`#${pre}-sabor`),
    peso_g: num(val(`#${pre}-peso`)) ?? '', dose_g: num(val(`#${pre}-dose`)) ?? '', proteina_dose_g: num(val(`#${pre}-prot`)) ?? '',
    preco_alvo: num(val(`#${pre}-alvo`)) ?? '', proteina_laudo_g: num(val(`#${pre}-laudo`)) ?? '', laudo_fonte: val(`#${pre}-laudo-fonte`),
  });
}

    <button class="w100 mt" data-a="coletarTodos" ${S.ui.coletando || !S.cfg.url ? 'disabled' : ''}>${S.ui.coletando ? 'Coletando…' : 'Coletar todos agora'}</button></div>`;
  h += '<div class="card">' + (lista.map(m => `<a class="li" href="#/monitor/${encodeURIComponent(m.monitor_id)}" data-mid="${esc(m.monitor_id)}">

        ${m.ultimo_erro && m.ultimo_status !== 'ok' ? `<div class="small clamp" style="color:var(--err)">${esc(m.ultimo_erro)}</div>` : ''}</span>
      <span class="right"><span class="num">${num(m.ultimo_preco) != null ? fmtR(num(m.ultimo_preco)) : ''}</span><br>${tagStatus(m)}</span></a>`).join('')
    || '<p class="muted">Nenhum link monitorado ainda.</p>') + '</div>';
  h += `<button class="pri big mt" data-a="novoMonitor">+ Monitorar link</button>`;
  return h + nav('monitores');

function telaNovoMonitor() {
  const nm = S.ui.nm || (S.ui.nm = { url: '', previa: null, erro: null, lendo: false, manual: false, produto_id: '', sku: '' });
  let h = topoVoltar('Monitorar link');
  h += `<div class="card"><label class="f">Link da oferta</label>
    <input id="m-url" inputmode="url" value="${esc(nm.url)}" placeholder="https://www.loja.com.br/produto/p" autocomplete="off">
    <button class="pri w100 mt" data-a="extrair" ${nm.lendo ? 'disabled' : ''}>${nm.lendo ? 'Lendo a página…' : 'Ler oferta'}</button>
    <p class="muted small">O robô tenta a API da loja (VTEX, Shopify) e depois os dados estruturados da página.</p></div>`;
  if (nm.erro) {
    h += `<div class="card"><b style="color:var(--err)">Não consegui ler esta oferta</b><div class="small mt">${esc(nm.erro)}</div>
      <p class="muted small">Lojas como Mercado Livre, Amazon e Netshoes bloqueiam robôs: registre a cotação manualmente. Você também pode salvar o link mesmo assim; o robô tentará de novo.</p>
      <div class="row"><button class="grow" data-a="ir" data-h="#/cotacao/${encodeURIComponent(nm.produto_id || '')}">Cotação manual</button><button class="grow" data-a="nmManual">Salvar mesmo assim</button></div></div>`;
  }
  const pv = nm.previa;
  if (!pv && !nm.manual) return h;
  if (pv) {
    const sk = pv.skus.find(s => String(s.sku) === String(nm.sku)) || pv.skus[0];
    h += `<div class="card"><div class="row"><b class="grow">${esc(pv.nome)}</b><span class="tag ac">${esc(pv.adaptador)}</span></div>
      <div class="muted small">${esc(pv.marca || '')}${pv.peso_g ? ' · ' + fmtPeso(pv.peso_g) : ''}</div>
      ${pv.skus.length > 1 ? `<label class="f">Sabor acompanhado</label><select id="m-sku">${pv.skus.map(s => `<option value="${esc(s.sku)}" ${String(s.sku) === String(nm.sku) ? 'selected' : ''}>${esc(s.nome || s.sku)} — ${s.disponivel ? fmtR(s.preco) : 'esgotado'}</option>`).join('')}</select>` : ''}
      <div class="mt"><span class="valor">${sk.disponivel ? fmtR(sk.preco) : '—'}</span> ${sk.disponivel ? '' : '<span class="tag warn">esgotado</span>'}
        ${sk.preco_lista && sk.preco_lista > sk.preco ? `<span class="muted small"><s>${fmtR(sk.preco_lista)}</s></span>` : ''}</div></div>`;
  }
  const lojaHost = lojaPorHost(S.cache.lojas, nm.url);
  const prods = prodAtivos();
  const selProd = nm.produto_id || '';
  h += `<div class="card"><b>Produto</b><select id="m-prod" class="mt">
      <option value="">＋ Novo produto${pv ? ' a partir da oferta' : ''}</option>${prods.map(p => `<option value="${esc(p.produto_id)}" ${p.produto_id === selProd ? 'selected' : ''}>${esc(nomeProd(p))}${p.sabor ? ' · ' + esc(p.sabor) : ''}</option>`).join('')}</select>`;
  if (!selProd) {
    const sk = pv && (pv.skus.find(s => String(s.sku) === String(nm.sku)) || pv.skus[0]);
    const ehCreatina = pv && /creat/i.test(pv.nome);
    h += camposProduto({ categoria: ehCreatina ? 'creatina' : 'whey', marca: pv ? pv.marca : '', nome: pv ? pv.nome : '',
      tipo: ehCreatina ? (/creapure/i.test(pv.nome) ? 'creapure' : 'monohidratada') : pv && /isolad/i.test(pv.nome) ? 'isolado' : pv && /hidrolis/i.test(pv.nome) ? 'hidrolisado' : 'concentrado',
      sabor: sk ? sk.nome : '', peso_g: pv && pv.peso_g ? pv.peso_g : '', dose_g: ehCreatina ? 3 : '', proteina_dose_g: ehCreatina ? 3 : '' }, 'np');
  }
  h += `</div><div class="card"><b>Loja</b><select id="m-loja" class="mt">
      <option value="">＋ Nova loja${hostDe(nm.url) ? ': ' + esc(hostDe(nm.url)) : ''}</option>${lojasOrd().map(l => `<option value="${esc(l.loja_id)}" ${lojaHost && lojaHost.loja_id === l.loja_id ? 'selected' : ''}>${esc(l.nome)}</option>`).join('')}</select>
    ${lojaHost ? '' : `<label class="f">Nome da nova loja</label><input id="m-loja-nome" value="${esc(nomeDeHost(hostDe(nm.url)))}">`}</div>`;
  h += `<div class="bottom"><div class="row"><button class="big grow" data-a="voltar">Cancelar</button><button class="okb big grow" data-a="salvarMonitor">Salvar</button></div></div>`;
  return h;
}

      <span class="muted small">${esc(m.adaptador || '')}${num(m.falhas_seguidas) ? ` · ${num(m.falhas_seguidas)} falha(s) seguida(s)` : ''}</span></div></div>
    ${m.ultimo_erro ? `<div class="small mt" style="color:var(--err)">${esc(m.ultimo_erro)}</div>` : ''}
    <a class="li mt" href="${esc(m.url)}" target="_blank" rel="noopener"><span class="grow small clamp">${esc(m.url)}</span>↗</a></div>`;
  h += `<button class="pri big" data-a="coletarUm" data-id="${esc(id)}" ${S.ui.coletando || !S.cfg.url ? 'disabled' : ''}>${S.ui.coletando ? 'Coletando…' : 'Coletar agora'}</button>`;

    <label class="f">Código do sabor (SKU)</label><input id="mo-sku" value="${esc(m.sku)}">
    <div class="row mt"><button class="danger grow" data-a="excluirMonitor" data-id="${esc(id)}">Excluir</button><button class="okb grow" data-a="salvarMonitorEd" data-id="${esc(id)}">Salvar</button></div>

  if (p) h += `<a class="li" href="#/produto/${encodeURIComponent(p.produto_id)}">Ver histórico do produto →</a>`;
  return h + nav('monitores');
}

    <label class="f">Loja</label><select id="c-loja">${lojasOrd().map(l => `<option value="${esc(l.loja_id)}" ${l.loja_id === ultimaLoja ? 'selected' : ''}>${esc(l.nome)}</option>`).join('')}<option value="">＋ Nova loja…</option></select>

    <div class="grid2 mt"><label>Frete (R$)<input id="c-frete" inputmode="decimal" placeholder="regra da loja"></label>
      <label>Desconto (R$)<input id="c-desc" inputmode="decimal" placeholder="regra da loja"></label></div>

// ---------------------------------------------------------------- modais
function modalHtml() {
  const m = S.ui.modal;
  if (!m) return '';
  let c = '';
  if (m.t === 'novo') {
    c = `<h3>Adicionar</h3>
      <button class="pri big w100" data-a="novoMonitor">Monitorar link (robô)</button>
      <button class="big w100 mt" data-a="ir" data-h="#/cotacao/">Cotação manual</button>

      <button class="ghost big w100 mt" data-a="fecharModal">Fechar</button>`;
  } else if (m.t === 'cot') {
    const x = S.cache.cotacoes.find(y => y.cotacao_id === m.id);
    if (!x) { S.ui.modal = null; return ''; }
    const ce = custoEfetivo(x, lojaPorId(x.loja_id));
    c = `<h3>Cotação de ${fmtData(x.data)}</h3>
      <div>${esc(nomeLoja(x.loja_id))} · ${x.origem === 'manual' ? 'manual' : 'robô'} · ${fmtDataHora(x.data)}</div>
      <div class="stats mt"><div class="stat"><span class="muted small">Preço</span><b>${fmtR(num(x.preco))}</b></div>
        <div class="stat"><span class="muted small">Custo efetivo</span><b>${ce ? fmtR(ce.custo) : '—'}</b>
        <span class="muted small">${ce ? `desconto ${fmtR(ce.desconto)} · frete ${fmtR(ce.frete)}` : 'indisponível'}</span></div></div>
      ${x.obs ? `<p>${esc(x.obs)}</p>` : ''}
      ${x.url ? `<a class="btn w100 mt" href="${esc(x.url)}" target="_blank" rel="noopener">Abrir oferta ↗</a>` : ''}
      ${x.origem === 'manual' ? `<button class="danger big w100 mt" data-a="excluirCotacao" data-id="${esc(x.cotacao_id)}">Excluir cotação</button>` : ''}

  }
  return c ? `<div class="modal-bg" data-a="fecharModal" data-fundo="1"><div class="modal" role="dialog">${c}</div></div>` : '';
}

// ---------------------------------------------------------------- ações
function abrirModal(m) { S.ui.modal = m; render(); }
function fecharModal() { S.ui.modal = null; render(); }

/** Garante a loja escolhida no formulário: existente ou nova (criada na fila). → loja_id */
function garantirLoja(id, nome, url) {
  if (id) return id;
  const host = hostDe(url);
  const l = { loja_id: uuid(), nome: nome || nomeDeHost(host) || 'Loja', tipo: url ? 'online' : 'fisica',
    url: host ? String(url).match(/^https?:\/\/[^\/?#]+/i)[0] : '', plataforma: 'outra', ativo: true };
  upsertLocal('lojas', 'loja_id', l);
  enfileirarOp('upsert', 'Lojas', l.loja_id, pick(l, COLS.Lojas));
  return l.loja_id;
}
function validarProduto(p) {
  if (!p.nome) { toast('Informe o nome do produto'); return false; }
  if (p.peso_g === '' || p.dose_g === '' || p.proteina_dose_g === '') toast(`Sem peso, dose e ${ativoDe(p)} por dose o produto não entra no R$/kg`);
  return true;
}

const acoes = {
  ir: el => { S.ui.modal = null; if (location.hash === el.dataset.h) render(); else location.hash = el.dataset.h; },
  voltar: () => history.length > 1 ? history.back() : (location.hash = '#/'),
  modal: el => abrirModal({ t: el.dataset.t, id: el.dataset.id }),
  fecharModal: () => fecharModal(),

  // ranking
  janela: el => { S.filtros.janela_dias = Number(el.dataset.d); salvar.filtros(); render(); },
  toggleDisp: () => { S.filtros.soDisponiveis = S.filtros.soDisponiveis === false; salvar.filtros(); render(); },
  toggleArq: () => { S.ui.verArquivados = !S.ui.verArquivados; render(); },
  categoria: el => { S.filtros.categoria = el.dataset.c; S.filtros.tipo = ''; S.filtros.marca = ''; salvar.filtros(); render(); },
  diasGraf: el => { S.filtros.dias_graf = Number(el.dataset.d); salvar.filtros(); render(); },
  // Abre/fecha a marca sem redesenhar a tela (mantém a busca digitada)
  toggleMarca: el => {
    const m = el.dataset.m, aberta = !S.ui.marcasAbertas.has(m);
    if (aberta) S.ui.marcasAbertas.add(m); else S.ui.marcasAbertas.delete(m);
    el.setAttribute('aria-expanded', aberta);
    el.nextElementSibling.hidden = !aberta;
  },

  // produtos
  salvarProduto: el => {
    const base = el.dataset.id ? prodPorId(el.dataset.id) : { produto_id: uuid() };
    const p = Object.assign(lerProduto('p', base), { obs: val('#p-obs'), ativo: $('#p-ativo').checked });
    if (!validarProduto(p)) return;
    upsertLocal('produtos', 'produto_id', p);
    enfileirarOp('upsert', 'Produtos', p.produto_id, pick(p, COLS.Produtos));
    // RP-05: arquivar o produto pausa os links dele
    S.cache.monitores.filter(m => m.produto_id === p.produto_id && bool(m.ativo, true) !== p.ativo).forEach(m => {
      m.ativo = p.ativo;
      enfileirarOp('upsert', 'Monitores', m.monitor_id, { ativo: p.ativo });
    });
    salvar.cache();
    toast('Produto salvo');
    if (el.dataset.id) acoes.voltar(); else location.hash = '#/produto/' + encodeURIComponent(p.produto_id);
  },

  // lojas
  salvarLoja: el => {
    const nome = val('#l-nome');
    if (!nome) { toast('Informe o nome da loja'); return; }
    const l = {
      loja_id: el.dataset.id || uuid(), nome, tipo: val('#l-tipo'), url: val('#l-url'), plataforma: val('#l-plat'),
      desconto_pix_pct: num(val('#l-pix')) ?? '', cupom_pct: num(val('#l-cupom-pct')) ?? '', cupom: val('#l-cupom'),
      frete_fixo: num(val('#l-frete')) ?? '', frete_gratis_acima: num(val('#l-gratis')) ?? '', ativo: $('#l-ativo').checked,
    };
    upsertLocal('lojas', 'loja_id', l);
    salvar.cache();
    enfileirarOp('upsert', 'Lojas', l.loja_id, pick(l, COLS.Lojas));
    toast('Loja salva');
    acoes.voltar();
  },

  // robô
  novoMonitor: el => {
    S.ui.nm = { url: '', previa: null, erro: null, lendo: false, manual: false, produto_id: (el && el.dataset.pid) || '', sku: '' };
    S.ui.modal = null;
    if (location.hash === '#/monitor/novo') render(); else location.hash = '#/monitor/novo';
  },
  extrair: () => extrairLink(),
  nmManual: () => { S.ui.nm.manual = true; S.ui.nm.url = val('#m-url'); render(); },
  salvarMonitor: () => {
    const nm = S.ui.nm, pv = nm.previa;
    nm.url = val('#m-url') || nm.url;
    if (!/^https?:\/\//i.test(nm.url)) { toast('Link inválido'); return; }
    let pid = val('#m-prod');
    if (!pid) {
      const p = Object.assign(lerProduto('np', { produto_id: uuid() }), { ativo: true, obs: '' });
      if (!validarProduto(p)) return;
      upsertLocal('produtos', 'produto_id', p);
      enfileirarOp('upsert', 'Produtos', p.produto_id, pick(p, COLS.Produtos));
      pid = p.produto_id;
    }
    const lojaId = garantirLoja(val('#m-loja'), val('#m-loja-nome'), nm.url);
    const loja = lojaPorId(lojaId);
    if (pv && loja && (!loja.plataforma || loja.plataforma === 'outra') && (pv.adaptador === 'vtex' || pv.adaptador === 'shopify')) {
      loja.plataforma = pv.adaptador;
      enfileirarOp('upsert', 'Lojas', lojaId, { plataforma: pv.adaptador });
    }
    const sk = pv && (pv.skus.find(s => String(s.sku) === String(nm.sku)) || pv.skus[0]);
    const m = { monitor_id: uuid(), produto_id: pid, loja_id: lojaId, url: nm.url, sku: sk ? String(sk.sku) : '', sku_nome: sk ? sk.nome || '' : '',
      adaptador: pv ? pv.adaptador : '', ativo: true };
    upsertLocal('monitores', 'monitor_id', m);
    enfileirarOp('upsert', 'Monitores', m.monitor_id, pick(m, COLS.Monitores));
    if (sk) {
      // A prévia já é uma observação de preço: vira a cotação automática de hoje
      const agora = Date.now();
      const c = { cotacao_id: idCotacaoAuto(m.monitor_id, agora), produto_id: pid, loja_id: lojaId, monitor_id: m.monitor_id, origem: 'auto',
        data: iso(agora), preco: sk.disponivel ? sk.preco : '', preco_min_dia: sk.disponivel ? sk.preco : '', preco_lista: sk.preco_lista ?? '',
        disponivel: !!sk.disponivel, registrado_em: iso(agora) };
      S.cache.cotacoes.push(c);
      enfileirarOp('upsert', 'Cotacoes', c.cotacao_id, pick(c, COLS.Cotacoes));
      Object.assign(m, { ultima_coleta: c.data, ultimo_preco: c.preco, ultimo_status: sk.disponivel ? 'ok' : 'indisponivel' });
      enfileirarOp('upsert', 'Monitores', m.monitor_id, pick(m, ['ultima_coleta', 'ultimo_preco', 'ultimo_status']));
    }
    salvar.cache();
    S.ui.nm = null;
    toast(pv ? 'Link monitorado' : 'Link salvo; o robô tentará na próxima rodada');
    location.hash = '#/produto/' + encodeURIComponent(pid);
  },
  salvarMonitorEd: el => {
    const m = monPorId(el.dataset.id), ativo = $('#mo-ativo').checked;
    const d = { ativo, sku: val('#mo-sku') };
    if (d.sku !== String(m.sku || '')) d.sku_nome = '';
    if (ativo && !bool(m.ativo, true)) Object.assign(d, { falhas_seguidas: 0, ultimo_status: '', ultimo_erro: '' }); // reativar zera as falhas
    Object.assign(m, d);
    salvar.cache();
    enfileirarOp('upsert', 'Monitores', m.monitor_id, d);
    toast('Link salvo');
    render();
  },
  excluirMonitor: el => {
    if (!confirm('Excluir este link? As cotações já gravadas ficam.')) return;
    S.cache.monitores = S.cache.monitores.filter(m => m.monitor_id !== el.dataset.id);
    salvar.cache();
    enfileirarOp('delete', 'Monitores', el.dataset.id);
    acoes.voltar();
  },
  coletarUm: el => coletarAgora(el.dataset.id),
  coletarTodos: () => coletarAgora(''),

  // cotações
  salvarCotacao: () => {
    const preco = num(val('#c-preco'));
    const disp = $('#c-disp').checked;
    if (disp && !(preco > 0)) { toast('Informe o preço'); $('#c-preco').focus(); return; }
    const lojaSel = val('#c-loja');
    if (!lojaSel && !val('#c-loja-nome')) { toast('Informe o nome da nova loja'); return; }
    const lojaId = garantirLoja(lojaSel, val('#c-loja-nome'), '');
    const agora = Date.now();
    const c = { cotacao_id: uuid(), produto_id: val('#c-prod'), loja_id: lojaId, monitor_id: '', origem: 'manual', data: iso(agora),
      preco: preco ?? '', preco_min_dia: preco ?? '', preco_lista: '', frete: num(val('#c-frete')) ?? '', desconto: num(val('#c-desc')) ?? '',
      disponivel: disp, url: val('#c-url'), obs: val('#c-obs'), registrado_em: iso(agora) };
    S.cache.cotacoes.push(c);
    salvar.cache();
    LS.set('ultimaLoja', lojaId);
    enfileirarOp('upsert', 'Cotacoes', c.cotacao_id, pick(c, COLS.Cotacoes));
    toast('Cotação registrada');
    location.hash = '#/produto/' + encodeURIComponent(c.produto_id);
  },
  excluirCotacao: el => {
    if (!confirm('Excluir esta cotação?')) return;
    S.cache.cotacoes = S.cache.cotacoes.filter(c => c.cotacao_id !== el.dataset.id);
    salvar.cache();
    enfileirarOp('delete', 'Cotacoes', el.dataset.id);
    fecharModal();
  },

  // config
  salvarCfg: () => {
    S.cfg = { url: $('#c-url').value.trim(), token: $('#c-token').value.trim() };
    salvar.cfg(); S.sync.erro = null; S.sync.espera = 0;
    toast('Conexão salva');
    carregarDados(false).then(render);
  },
  testarConexao: async () => {
    const ant = S.cfg;
    S.cfg = { url: $('#c-url').value.trim(), token: $('#c-token').value.trim() };
    try { const r = await api('GET', null, { acao: 'ping' }); toast(`OK — planilha "${r.planilha}", v${r.versao}`); }
    catch (e) { toast('Falhou: ' + e.message); }
    finally { S.cfg = ant; }
  },
  syncAgora: async () => { S.sync.espera = 0; await sincronizar(); render(); toast(S.fila.length ? 'Ainda há pendentes' : 'Tudo enviado'); },
  recarregar: async () => { await carregarDados(false); render(); },
  salvarConfigApp: () => {
    const cfg = S.cache.config;
    const campos = { intervalo_coleta_h: num(val('#r-int')), janela_dias: num(val('#r-jan')), falhas_para_pausar: num(val('#r-falhas')),
      historico_dias: num(val('#r-hist')), cep: val('#r-cep').replace(/\D/g, ''), email_alertas: val('#r-email'), evitar_lactose: val('#r-lact') };
    Object.entries(campos).forEach(([k, v]) => {
      if (v == null || (typeof v === 'number' && v < 0) || String(v) === String(cfg[k] ?? (DEF[k] ?? ''))) return;
      cfg[k] = v;
      enfileirarOp('upsert', 'Config', k, { valor: v });
    });
    S.filtros.janela_dias = null; salvar.filtros(); // volta a seguir a janela padrão
    salvar.cache(); toast('Configurações salvas'); render();
  },
};

// ---------------------------------------------------------------- eventos
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.dataset.fundo && ev.target !== el) return; // clique dentro do modal, fora de um botão
  const fn = acoes[el.dataset.a];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'busca') {
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('[data-busca]').forEach(x => { x.style.display = !q || x.dataset.busca.includes(q) || x.closest('[data-grupo]').dataset.marca.toLowerCase().includes(q) ? '' : 'none'; });
    // Buscando, abre as marcas com resultado e esconde as outras; sem busca, volta ao aberto/fechado escolhido
    document.querySelectorAll('[data-grupo]').forEach(g => {
      const algum = [...g.querySelectorAll('[data-busca]')].some(x => x.style.display !== 'none');
      g.style.display = !q || algum ? '' : 'none';
      const aberta = q ? algum : S.ui.marcasAbertas.has(g.dataset.grupo);
      g.querySelector('.grupo-corpo').hidden = !aberta;
      g.querySelector('[data-a="toggleMarca"]').setAttribute('aria-expanded', aberta);
    });
  } else if (t.dataset.pct) {
    const pre = t.dataset.pct;
    $(`#${pre}-pct`).innerHTML = pctTxt(metricas({ peso_g: val(`#${pre}-peso`), dose_g: val(`#${pre}-dose`), proteina_dose_g: val(`#${pre}-prot`),
      proteina_laudo_g: val(`#${pre}-laudo`) }, null).pct, val(`#${pre}-cat`) || 'whey');
  } else if (t.id === 'm-url' && S.ui.nm) {
    S.ui.nm.url = t.value.trim();
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (['f-tipo', 'f-marca', 'f-loja'].includes(t.id)) {
    S.filtros[t.id.slice(2)] = t.value; salvar.filtros(); render();
  } else if (t.id === 'm-sku' && S.ui.nm) {
    S.ui.nm.sku = t.value; render();
  } else if (t.id === 'm-prod' && S.ui.nm) {
    S.ui.nm.produto_id = t.value; render();
  } else if (t.dataset.cat) {
    // Trocar a categoria no editor: tipos e rótulos da categoria nova
    const pre = t.dataset.cat, c = CATEGORIAS[t.value];
    $(`#${pre}-tipo`).innerHTML = opcoesTipo(t.value, '');
    $(`#${pre}-l-prot`).textContent = Cap(c.ativo) + '/dose (g)';
    $(`#${pre}-l-laudo`).textContent = Cap(c.ativo) + '/dose no laudo (g)';
    $(`#${pre}-dose`).placeholder = c.dose; $(`#${pre}-prot`).placeholder = c.porDose;
    $(`#${pre}-pct`).innerHTML = pctTxt(metricas({ peso_g: val(`#${pre}-peso`), dose_g: val(`#${pre}-dose`), proteina_dose_g: val(`#${pre}-prot`),
      proteina_laudo_g: val(`#${pre}-laudo`) }, null).pct, t.value);
  } else if (t.id === 'c-loja') {
    $('#c-loja-nome').style.display = t.value ? 'none' : '';
  }
});

// Gráfico: toque ou ponteiro mostra o ponto mais próximo (crosshair + dica)
// Vale para todo <svg data-graf>: os pontos ficam em S.ui.grafs[id]; a linha e a dica são #id-x e #id-tip
function dicaGrafico(ev) {
  const svg = ev.target.closest && ev.target.closest('svg[data-graf]');
  const pts = svg && S.ui.grafs[svg.id];
  if (!pts || !pts.length) return;
  const r = svg.getBoundingClientRect(), W = svg.viewBox.baseVal.width;
  const vx = (ev.clientX - r.left) * W / r.width;
  const p = pts.reduce((a, b) => Math.abs(b.x - vx) < Math.abs(a.x - vx) ? b : a);
  const lx = $(`#${svg.id}-x`), tip = $(`#${svg.id}-tip`);
  lx.setAttribute('x1', p.x); lx.setAttribute('x2', p.x); lx.style.display = '';
  tip.textContent = p.txt;
  tip.classList.add('on');
  const px = p.x / W * r.width;
  if (tip.classList.contains('ml')) {
    // Dica de várias linhas: fica do lado oposto ao dedo, dentro do gráfico
    const w = tip.offsetWidth;
    tip.style.left = (px > r.width / 2 ? Math.max(0, px - w - 12) : Math.min(px + 12, r.width - w)) + 'px';
    tip.style.top = '0px';
  } else {
    tip.style.left = Math.min(Math.max(px, 90), r.width - 90) + 'px';
    tip.style.top = Math.max(0, p.y / W * r.width - 40) + 'px';
  }
}
document.addEventListener('pointermove', dicaGrafico);
document.addEventListener('pointerdown', dicaGrafico);
document.addEventListener('pointerout', ev => {
  const svg = ev.target.closest && ev.target.closest('svg[data-graf]');
  if (svg && !(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('#' + svg.id))) {
    const tip = $(`#${svg.id}-tip`), lx = $(`#${svg.id}-x`);
    if (tip) tip.classList.remove('on');
    if (lx) lx.style.display = 'none';
  }
});

window.addEventListener('hashchange', () => { S.ui.modal = null; render(); window.scrollTo(0, 0); });
window.addEventListener('online', () => { S.sync.espera = 0; sincronizar(); });
window.addEventListener('offline', atualizarBadge);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  sincronizar();

  if (Date.now() - S.cache.atualizadoEm > 10 * 60e3) carregarDados(true);
});

window.addEventListener('storage', ev => {
  if (!ev.key || !ev.key.startsWith('whey.')) return;
  S.fila = LS.get('fila', []); S.cache = Object.assign({}, CACHE_VAZIO, LS.get('cache', {}));
  render();
});

// ---------------------------------------------------------------- testes no navegador (?test)
function rodarTestes() {
  const res = [];
